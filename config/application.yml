database:
  mysql:
    host: ${MYSQL_HOST}
    port: ${MYSQL_PORT}
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    database: ${MYSQL_DATABASE}
    # 语法 ${环境变量:默认值}：未在 .env 中定义时回退到默认值
    charset: ${MYSQL_CHARSET:utf8mb4}
    connect_timeout: ${MYSQL_CONNECT_TIMEOUT:15}
    read_timeout: ${MYSQL_READ_TIMEOUT:600}

ssh:
  enabled: ${SSH_ENABLED}
  host: ${SSH_HOST}
  port: ${SSH_PORT}
  user: ${SSH_USER}
  private_key: ${SSH_PRIVATE_KEY}
  private_key_password: ${SSH_PRIVATE_KEY_PASSWORD}
  remote_host: ${MYSQL_REMOTE_HOST}
  remote_port: ${MYSQL_REMOTE_PORT}
  host_key: ${SSH_HOST_KEY}